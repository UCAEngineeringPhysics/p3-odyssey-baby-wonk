ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_acceleration: false
    publish_tf: true            # EKF owns odom -> base_link TF

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Raw wheel-encoder odometry from pico_interface
    odom0: odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,   # fuse vx (forward velocity)
                   false, false, true,    # fuse vyaw (turn rate)
                   false, false, false]

    # IMU from MPU6050 via pico_interface
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,    # fuse gyro z (yaw rate)
                  false, false, false]
    imu0_remove_gravitational_acceleration: true
